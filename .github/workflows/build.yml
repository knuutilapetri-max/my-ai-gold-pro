name: Build MY AI GOLD PRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir android-project
          unzip MY_AI_GOLD_PRO_v66_ANDROID_STUDIO_PROJECT.zip -d android-project

      - uses: actions/setup-java@v4
         with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MY-AI-GOLD-PRO-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
